name: Build Release Candidates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            arch: x64
            command: npm run dist:win:x64 -- --publish=never
          - name: Windows
            runner: windows-11-arm
            arch: arm64
            command: npm run dist:win:arm64 -- --publish=never
          - name: macOS
            runner: macos-15
            arch: arm64
            command: npm run dist:mac:arm64 -- --publish=never
          - name: macOS
            runner: macos-15-intel
            arch: x64
            command: npm run dist:mac:x64 -- --publish=never

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.msi
            release/*.msix
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.yaml
          if-no-files-found: error
          retention-days: 7
