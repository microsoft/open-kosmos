name: PR File Length Check

# Enforce file-length policy in pull requests:
# 1) non-allowlisted code files must stay <= 1000 lines
# 2) allowlisted files changed in PR must have net growth <= 50 lines

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '22'

concurrency:
  group: file-length-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-file-length:
    name: File Length Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run file-length check and generate report
        id: check
        run: |
          set +e
          node scripts/check-file-length.js \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref ${{ github.event.pull_request.head.sha }} \
            --output file-length-report.md
          CHECK_EXIT=$?
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT
          set -e

      - name: Read report content
        id: report
        run: |
          REPORT=$(cat file-length-report.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: file-length-report
          message: |
            <!-- file-length-report -->
            ${{ steps.report.outputs.content }}

            <sub>Generated by [PR File Length Check](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>

      - name: Fail if policy violated
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::File length policy violated. See PR comment report for details."
          exit 1
