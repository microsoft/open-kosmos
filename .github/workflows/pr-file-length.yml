name: PR File Length Check

# Enforce file-length policy in pull requests:
# 1) non-allowlisted code files must stay <= 1000 lines
# 2) allowlisted files changed in PR must have net growth <= 50 lines

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  NODE_VERSION: '22'

concurrency:
  group: file-length-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-file-length:
    name: File Length Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run file-length check and generate report
        id: check
        run: |
          set +e
          node scripts/check-file-length.js \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref ${{ github.event.pull_request.head.sha }} \
            --output file-length-report.md
          CHECK_EXIT=$?
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT
          set -e

      - name: Append report to job summary
        run: cat file-length-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if policy violated
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::File length policy violated. See PR comment report for details."
          exit 1
