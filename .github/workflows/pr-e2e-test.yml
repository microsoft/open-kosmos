name: PR E2E Tests

# Run Playwright E2E tests for every pull request to catch regressions early.
# Tests launch the Electron app in a headless environment and validate core user flows.

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

# Only one E2E run allowed per PR at a time (cancel previous)
concurrency:
  group: e2e-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The cursor-overlay render smoke test rasterizes the overlay payload in a
      # standalone Chromium page (Playwright's `page` fixture), unlike the Electron
      # flow tests which use the bundled Electron binary. Install that browser.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # pretest:e2e builds with DOTENV_CONFIG_PATH=.env.test
      - name: Run E2E Tests
        run: npm run test:e2e --max-failures=1
        env:
          BRAND: openkosmos


      # Upload test report & artifacts (screenshots, video, trace) on failure for debugging
      - name: Upload E2E test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-report
          path: |
            tests/e2e/test-results/
            tests/e2e/report/
          retention-days: 7
