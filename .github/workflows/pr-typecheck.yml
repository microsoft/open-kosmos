name: PR Type Check

# Run TypeScript type checking for every pull request to catch type errors early.
# Checks main, preload, and renderer processes with their respective tsconfigs.

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck
